 adventurer_malice_implicit_perk_effect: "[adventurer_i] Выплата [Concept('gold','золота')|E] за [Concept('criminal_task_contract','преступный контракт')|E]: #P +33%#![gold_i]"
 adventurers_make_local_deals_option.tt: "Проходя через [Concept( 'barony', 'баронство' )|E], вы получаете #bold некую часть%#! от стоимости [Concept( 'raid_loot', 'добычи' )|E] во [Concept( 'holding', 'владении' )|E] в виде [gold_i][Concept( 'gold', 'золота' )|E].\n#weak (золото дается один раз за каждое владение)#!"
 
 camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$Находит больше [Concept('mercenary_task_contracts','контрактов наемника')|E]\n$EFFECT_LIST_BULLET$Находит больше [Concept('task_contracts','контрактов')|E], связанных с [Concept('prowess','доблестью')|E] и [Concept('martial','военным делом')|E]\n$EFFECT_LIST_BULLET$Открывает такие [Concept('camp_buildings','лагерные постройки')|E], как:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_palisade').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$EFFECT_LIST_BULLET$Открывает ряд уникальных лагерных [Concept('officers','подручных')|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Открывается через постройку здания «$baggage_train_siege_engineers_domicile_building$»)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Открывается через постройку здания «$proving_grounds_lockwagon_domicile_building$»)#!\n\n#WEAK Наемники в первую очередь зарабатывают на жизнь мечом. Обычно действуют законными методами, но когда наступают тяжелые времена, а у тебя нет ничего, кроме топора...#!"
 camp_purpose_scholars_effects: "$EFFECT_LIST_BULLET$Находит больше [Concept('task_contracts','контрактов')|E], связанных с [Concept('learning','ученостью')|E] и [Concept('stewardship','управлением')|E]\n$EFFECT_LIST_BULLET$Находит немного больше [Concept('task_contracts','договоров')|E], связанных с [Concept('diplomacy','дипломатией')|E]\n$EFFECT_LIST_BULLET$Открывает такие [Concept('camp_buildings','лагерные постройки')|E], как:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_reference_corpus').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ascetics').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_nightly_debates').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n\n#WEAK Книга, хранимая в одной библиотеке, не знает покоя, а идея, хранимая в одной голове, прозябает зря.#!"
 camp_purpose_explorers_effects: "$EFFECT_LIST_BULLET$Выплата [Concept('gold','золота')|E] за [Concept('transport_task_contracts','контракт на перевозку')|E]: #P +25%#![gold_i]\n$EFFECT_LIST_BULLET$Находит больше [Concept('transport_task_contracts','контрактов на перевозку')|E]\n$EFFECT_LIST_BULLET$Находит больше [Concept('task_contracts','контрактов')|E], связанных с [Concept('diplomacy','дипломатией')|E] и [Concept('intrigue','интригами')|E]\n$EFFECT_LIST_BULLET$Находит немного больше [Concept('task_contracts','контрактов')|E], связанных с [Concept('martial','военным делом')|E]\n$EFFECT_LIST_BULLET$Открывает такие [Concept('camp_buildings','лагерные постройки')|E], как:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_provisions').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_water').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_climbing_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_local_hangers_on').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n\n#WEAK За горизонтом всегда ждут новый холм, новая гора, новая культура, новый язык...#!"
