 game_concept_adventurer_siege_replenishment_desc: "Когда [Concept('adventurers', 'авантюрист')|E] успешно [Concept('sieges', 'осаждает')|E] [Concept('holding', 'владение')|E], он частично пополняет ряды своих [Concept('men_at_arms', 'профессиональных солдат')|E].\n\nВсе [Concept('regiments', 'полки')|E] [Concept('men_at_arms', 'профессионалов')|E] в [Concept('army', 'армии')|E] пополняются в #V половину#! размера [Concept('loot', 'добычи')|E] во [Concept('holding', 'владении')|E].\n\n#weak Пополнение происходит за счет новобранцев, вербовки местных жителей и платы тем, кто отбился от своих во время осады.#!"
