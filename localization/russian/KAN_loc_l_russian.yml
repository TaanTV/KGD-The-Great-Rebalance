l_russian:
 kan_prefix: "#bold #highlight KAN:#!#!"
 rule_kan_camp_building_restrictions: "$kan_prefix$ Ограничения [Concept('camp_building','Лагерных Построек')|E]"
 setting_kan_camp_building_restrictions_default: "#high По умолчанию#!"
 setting_kan_camp_building_restrictions_default_desc: "Некоторые [Concept('camp_building','Лагерные Постройки')|E] будут доступны только лагерям с определенной [Concept('camp_purpose','Целью')|E]."
 setting_kan_camp_building_restrictions_wanderers_exemption: "#high Скитальцы#!"
 setting_kan_camp_building_restrictions_wanderers_exemption_desc: "Некоторые [Concept('camp_building','Лагерные Постройки')|E] будут доступны только лагерям с определенной [Concept('camp_purpose','Целью')|E]. [GetLaw('camp_purpose_wanderers').GetName] могут строить все [Concept('camp_building','Лагерные Постройки')|E].\n @warning_icon! #X Эта опция может сломать баланс#!"
 setting_kan_camp_building_restrictions_no_restrictions: "#high Без ограничений#!"
 setting_kan_camp_building_restrictions_no_restrictions_desc: "Все [Concept('camp_building','Лагерные Постройки')|E] доступны всем.\n @warning_icon! #X Эта опция сломает баланс#!"
 rule_kan_contract_payment: "$kan_prefix$ Влияние [Concept('task_contract','Контрактов')|E] на ИИ"
 setting_kan_contract_payment_vanilla: "#high По умолчанию#!"
 setting_kan_contract_payment_vanilla_desc: "Никаких изменений. Никакой пощады."
 setting_kan_contract_payment_thin_air: "#high Нулевое#!"
 setting_kan_contract_payment_thin_air_desc: "Почти все [task_contracts|E] спавнят золото из воздуха, дабы не банкротить бедных ИИ игроков."
 rule_kan_laamp_courtier_provision_maintaince: "$kan_prefix$ Потребление [Concept('provisions','Припасов')|E] [Concept('courtiers','Последователями')|E]"
 setting_kan_laamp_courtier_provision_maintaince_disabled: "#high Отключено#!"
 setting_kan_laamp_courtier_provision_maintaince_disabled_desc: "[Concept('courtiers','Последователи')|E] не будут потреблять [provisions|e]." 
 setting_kan_laamp_courtier_provision_maintaince_enabled: "#high Включено#!"
 setting_kan_laamp_courtier_provision_maintaince_enabled_desc: "Каждый [Concept('courtiers','Последователь')|E] будет потреблять небольшое количество [Concept('provisions','Припасов')|E] каждый месяц в зависимости от его [Concept('traits','Свойств')|E] и [Concept('prowess','Доблести')|E]"
 setting_kan_laamp_courtier_provision_maintaince_halved: "#high х0.5#!"
 setting_kan_laamp_courtier_provision_maintaince_halved_desc: "Каждый [Concept('courtiers','Последователь')|E] будет потреблять мизерное количество [Concept('provisions','Припасов')|E] каждый месяц в зависимости от его [Concept('traits','Свойств')|E] и [Concept('prowess','Доблести')|E]"
 setting_kan_laamp_courtier_provision_maintaince_doubled: "#high х2#!"
 setting_kan_laamp_courtier_provision_maintaince_doubled_desc: "Каждый [Concept('courtiers','Последователь')|E] будет потреблять среднее количество [Concept('provisions','Припасов')|E] каждый месяц в зависимости от его [Concept('traits','Свойств')|E] и [Concept('prowess','Доблести')|E]"
 rule_kan_contract_payment_amount: "$kan_prefix$ [gold|E] с [Concept('task_contract','Контрактов')|E]"
 setting_kan_contract_payment_amount_half: "#high х0.5#!"
 setting_kan_contract_payment_amount_half_desc: "Базовая награда [Concept('gold','Золотом')|E] с [Concept('task_contract','Контрактов')|E] уменьшена относительно стадартных значений этого мода." 
 setting_kan_contract_payment_amount_default: "#high По умолчанию#!"
 setting_kan_contract_payment_amount_default_desc: "Базовая награда [Concept('gold','Золотом')|E] с [Concept('task_contract','Контрактов')|E] значительно уменьшена относительно ванильной игры." 
 setting_kan_contract_payment_amount_double: "#high х1.5#!"
 setting_kan_contract_payment_amount_double_desc: "Базовая награда [Concept('gold','Золотом')|E] с [Concept('task_contract','Контрактов')|E] увеличена относительно стадартных значений этого мода." 
 setting_kan_contract_payment_amount_vanilla: "#high Почти Ванила#!"
 setting_kan_contract_payment_amount_vanilla_desc: "Базовая награда [Concept('gold','Золотом')|E] с [Concept('task_contract','Контрактов')|E] возвращена к ванильным значениям. Однако она все-равно скорее всего будет ниже чем в ванили."
 rule_kan_on_landed_army_keep: "$kan_prefix$ Армия [Concept('adventurers','Авантюристов')|E] после оседания"
 setting_kan_on_landed_army_keep_as_men_at_arms: "#high По Умолчанию#!"
 setting_kan_on_landed_army_keep_as_men_at_arms_desc: "[Concept('adventurers','Авантюристы')|E] не теряют [Concept('men_at_arms','Профессионалов')|E] при становлении [Concept('landed','Землевладельцем')|E]." 
 setting_kan_on_landed_army_keep_as_special_troops: "#high Особые Солдаты#!"
 setting_kan_on_landed_army_keep_as_special_troops_desc: "[men_at_arms|E] становятся [Concept('special_troops','Особыми Солдатами')|E] при становлении [Concept('landed','Землевладельцем')|E]\n @warning_icon! #X Войска из модов станут ополчением из-за ограничений движка#!."
 setting_kan_on_landed_army_keep_as_special_troops_inheritable: "#high Особые: Наследуемые#!"
 setting_kan_on_landed_army_keep_as_special_troops_inheritable_desc: "[men_at_arms|E] становятся наследуемыми [Concept('special_troops','Особыми Солдатами')|E] при становлении [Concept('landed','Землевладельцем')|E]\n @warning_icon! #X Войска из модов станут ополчением из-за ограничений движка#!."
 rule_kan_contract_payment_provisions_amount: "$kan_prefix$ [provisions|E] с [Concept('task_contract','Контрактов')|E]"
 setting_kan_contract_payment_provisions_amount_default: "#high По умолчанию#!"
 setting_kan_contract_payment_provisions_amount_default_desc: "Награда [Concept('provisions','Провизиями')|E] с [Concept('task_contract','Контрактов')|E] уменьшена примерно вдвое относительно ванильной игры."
 setting_kan_contract_payment_provisions_amount_vanilla: "#high Ванила#!"
 setting_kan_contract_payment_provisions_amount_vanilla_desc: "Награда [Concept('provisions','Провизиями')|E] с [Concept('task_contract','Контрактов')|E] возвращена к ванильным значениям."
 rule_kan_camp_building_cost: "$kan_prefix$ Стоимость [Concept('camp_building','Лагерных Построек')|E]"
 setting_kan_camp_building_cost_vanilla: "#high Ванила#!"
 setting_kan_camp_building_cost_vanilla_desc: "Для любителей палаток за 700 золота"
 setting_kan_camp_building_cost_low: "#high Низкая#!"
 setting_kan_camp_building_cost_low_desc: "Стоимость [Concept('camp_building','Лагерных Построек')|E] снижена на #high 25% #!"
 setting_kan_camp_building_cost_lower: "#high Очень низкая#!"
 setting_kan_camp_building_cost_lower_desc: "Стоимость [Concept('camp_building','Лагерных Построек')|E] снижена на #high 50% #!"
 
 contact_list_request_interaction.request_maa.plenty: "[actor.GetShortUIName|U] имеете слишком много [Concept( 'men_at_arms', 'профессионалов' )|E]: $VALUE|+=0$"
 contact_list_request_interaction.request_maa.little: "[actor.GetShortUIName|U] не имеете [Concept( 'men_at_arms', 'профессионалов' )|E]: $VALUE|+=0$"
 
 laamp_courtier_provisions_pulse_year_notification:0 "Отчет о провизиях"
 laamp_courtier_provisions_pulse_year_notification_desc:0 "За последний год некоторое количество Припасов было съедено последователями."
 
 ep3_laamp_decision_event.1045.a.cooldown.tt.faith: "Вы совсем недавно поменяли свою веру после размышлений в саду. Повторить это действие можно не раньше [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1045_contemplated_garden_converted_faith_recently') )]"
 
 ep3_laamp_decision_event.1043.c.cooldown.tt: "Вы совсем недавно успешно ограбили церковь. Повторить это действие можно не раньше [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1043_successful_steal') )]"
 
 ep3_laamp_decision_event.1051.a_c.tt: "Вы совсем недавно разминались в учебном бою. Повторить это действие можно не раньше [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1051_has_sparred_recently') )]"